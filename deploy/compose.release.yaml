# Release deployment: this file pulls the ready-made image and does not need the
# source tree. See https://aiden0rchad.github.io/homelab-atlas/getting-started
services:
  atlas:
    image: ghcr.io/aiden0rchad/homelab-atlas:${ATLAS_VERSION:-0.12.0}
    environment:
      ATLAS_ALLOWED_HOSTS: "${ATLAS_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
      ATLAS_API_TOKEN: "${ATLAS_API_TOKEN:-}"
      ATLAS_COLLECTOR_TOKEN: "${ATLAS_COLLECTOR_TOKEN:-}"
      ATLAS_NMAP_ALLOWED_CIDRS: "${ATLAS_NMAP_ALLOWED_CIDRS:-}"
    ports:
      - "${ATLAS_BIND:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - discovery
    restart: unless-stopped
  collector:
    profiles: ["discovery"]
    image: ghcr.io/aiden0rchad/homelab-atlas:${ATLAS_VERSION:-0.12.0}
    command: ["collect", "--listen", ":8081"]
    environment:
      ATLAS_COLLECTOR_TOKEN: "${ATLAS_COLLECTOR_TOKEN:-}"
      ATLAS_DOCKER_API_KEY: "${ATLAS_DOCKER_API_KEY:-}"
      ATLAS_HAWSER_TOKEN: "${ATLAS_HAWSER_TOKEN:-}"
      ATLAS_DOCKER_HOST: "${ATLAS_DOCKER_HOST:-unix:///var/run/docker.sock}"
      ATLAS_HOST_ID: localdocker
      ATLAS_HOST_NAME: Docker
      PORT: "8081"
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - discovery
    restart: unless-stopped
networks:
  discovery:
    internal: true
